[package]
name = "astral-key"
version = "0.1.0"
edition = "2021"
authors = ["Astral Key Contributors"]
description = "Ultra-minimal Passkey + Web3 (SIWE) auth sidecar"
license = "MIT"
repository = "https://github.com/reverb256/astral-key"
keywords = ["web3", "fido2", "passkey", "authentication"]
categories = ["authentication", "web-programming"]
rust-version = "1.75"

[workspace]
members = ["."]

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database (SQLite)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }

# Web3
ethers = { version = "2.0", features = ["rustls"] }
siwe = "0.6"

# FIDO2/WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
webauthn-rs-core = "0.5"
url = "2.5"

# JWT
jsonwebtoken = "9.2"

# Cryptography
ring = "0.17"
base64 = "0.21"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Configuration
config = "0.14"

# Utilities
async-trait = "0.1"
futures = "0.3"
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
production = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
