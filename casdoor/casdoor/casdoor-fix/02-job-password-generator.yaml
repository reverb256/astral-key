apiVersion: batch/v1
kind: Job
metadata:
  name: password-generator
  namespace: auth
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: password-generator
      containers:
      - name: generator
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Generating JIT password..."
            PASSWORD=$(date +%s | sha256sum | head -c32)
            echo "Creating secret via kubectl..."
            kubectl create secret generic casdoor-postgres-secret \
              --from-literal=POSTGRES_PASSWORD=$PASSWORD \
              --namespace=auth \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "Secret created successfully (zero-knowledge: $PASSWORD logged)"
