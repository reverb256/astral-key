apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: casdoor-mcp-allow
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app: casdoor
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: mcp
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - ipBlock:
        cidr: 10.1.1.0/24
    - ipBlock:
        cidr: 10.244.0.0/16
    ports:
    - port: 8000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: casdoor-egress-restrict
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app: casdoor
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: casdoor-postgres
          app.kubernetes.io/component: database
  - ports:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: casdoor-postgres-egress-restrict
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app: casdoor-postgres
      app.kubernetes.io/component: database
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          name: kube-system