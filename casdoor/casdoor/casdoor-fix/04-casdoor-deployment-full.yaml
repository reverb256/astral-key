apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  namespace: auth
  labels:
    app: casdoor
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: easykubenix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: casdoor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: casdoor
        app.kubernetes.io/component: api
        app.kubernetes.io/managed-by: easykubenix
    spec:
      serviceAccountName: casdoor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: zephyr
      containers:
      - name: casdoor
        image: docker.io/casbin/casdoor:3.49.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: RUNNING_IN_DOCKER
          value: "true"
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /conf/app.conf
          name: config
          subPath: app.conf
          readOnly: true
        - mountPath: /init_data.json
          name: init-data
          subPath: init_data.json
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      initContainers:
      - name: setup-config
        image: alpine:3.19
        command:
        - sh
        - -c
        - |
          set -e
          POSTGRES_PASSWORD=$(cat /postgres-secret/POSTGRES_PASSWORD)
          sed "s|\${POSTGRES_PASSWORD}|${POSTGRES_PASSWORD}|g" /template/app.conf.template > /config/app.conf
          echo "Config generated successfully"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: casdoor-postgres-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - mountPath: /template
          name: template
          readOnly: true
        - mountPath: /config
          name: config
        - mountPath: /postgres-secret
          name: postgres-secret
          readOnly: true
      volumes:
      - name: template
        configMap:
          name: casdoor-config
          items:
          - key: app.conf.template
            path: app.conf.template
      - name: config
        emptyDir: {}
      - name: postgres-secret
        secret:
          secretName: casdoor-postgres-secret
          items:
          - key: POSTGRES_PASSWORD
            path: POSTGRES_PASSWORD
      - name: init-data
        configMap:
          name: casdoor-init-data
          items:
          - key: init_data.json
            path: init_data.json