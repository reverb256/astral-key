# Validates the astral-key network policies on every change to the chart.
# Runs on a GitHub-hosted runner (setup-helm action) - no cluster needed;
# the live containment proof runs separately from zephyr.
name: NetworkPolicy validation

on:
  push:
    branches: [master, main]
    paths:
      - 'charts/astral-key/**'
      - 'scripts/test-networkpolicy.sh'
      - '.github/workflows/netpol-validation.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'charts/astral-key/**'
      - 'scripts/test-networkpolicy.sh'
      - '.github/workflows/netpol-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netpol:
    name: netpol assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Validate network policies
        run: bash scripts/test-networkpolicy.sh
