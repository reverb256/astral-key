[package]
name = "mosaic-bridge-activitypub"
version = "0.1.0"
description = "ActivityPub bridge daemon — implements W3C ActivityPub protocol (WebFinger, Actor, inbox/outbox, federation, HTTP Signatures)"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (for outbound federation requests)
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }

# ActivityPub signing uses HTTP Signatures (hs2019) — ring provides Ed25519
ring = "0.17"

# Cryptography helpers
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# URL parsing (for inbox URL handling in federation)
url = "2.5"

# Shared Mosaic client types
mosaic-client = { path = "../mosaic-client" }

# Error handling / logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for activity IDs
uuid = { version = "1.6", features = ["v4", "serde"] }
