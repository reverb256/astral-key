[package]
name = "mosaic-bridge-buzz"
version = "0.1.0"
edition = "2021"
description = "Nostr WebSocket relay bridge for Mosaic ↔ Nostr connectivity"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mosaic-client = { path = "../mosaic-client" }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
