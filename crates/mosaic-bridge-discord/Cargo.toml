[package]
name = "mosaic-bridge-discord"
version = "0.1.0"
description = "Discord bot bridge — connects Mosaic ↔ Discord via Gateway WebSocket and REST API"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }

# WebSocket (Discord Gateway)
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls"] }

# Web framework (HTTP server for /health and /send)
axum = { version = "0.7", features = ["macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (Discord REST API)
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }

# Shared Mosaic client types
mosaic-client = { path = "../mosaic-client" }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Stream utilities (for WebSocket split + select)
futures-util = "0.3"
