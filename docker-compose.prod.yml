# Astral Key - Production Docker Compose
version: '3.8'

services:
  astral-key:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astral-key
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info,astral_key=debug
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/astral_key
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - VAULTWARDEN_URL=http://vaultwarden:80
      - VAULTWARDEN_ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - astral-network

  postgres:
    image: postgres:15-alpine
    container_name: astral-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=astral_key
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astral-network

  redis:
    image: redis:7-alpine
    container_name: astral-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astral-network

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: astral-vaultwarden
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_ADDRESS=0.0.0.0
      - WEBSOCKET_PORT=3012
    volumes:
      - vaultwarden-data:/data
    networks:
      - astral-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: astral-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - astral-key
    networks:
      - astral-network

volumes:
  postgres-data:
  redis-data:
  vaultwarden-data:

networks:
  astral-network:
    driver: bridge
