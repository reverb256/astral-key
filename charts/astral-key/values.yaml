# Astral Key chart values — production instance (single-node nexus).
# Adopted under ArgoCD 2026-09-22 (app: astral-key, media-helm app-of-apps).

replicaCount: 1

image:
  # Registry-free convention (nexus:5000 decommissioned 2026-09-17):
  # built on nexus, imported via `docker save | k3s ctr images import`.
  repository: docker.io/library/astral-key
  tag: ""
  pullPolicy: Never

images:
  astral-key:
    # Rebuilt 2026-10-05 from origin/main 9e36630 on nexus via the Containerfile
    # (the root Dockerfile builds the mosaic-identity sidecar, not astral-key).
    #   docker build -f Containerfile -t docker.io/library/astral-key:2026-10-05-rebuild .
    #   docker save docker.io/library/astral-key:2026-10-05-rebuild \
    #     | sudo -n k3s ctr images import -
    # The previous pin (5eb69f5d7662...) was imported once on 2026-09-22 and has
    # since been garbage-collected from containerd on nexus/forge/zephyr, which is
    # why the Deployment sat at ErrImageNeverPull for days. Nothing in git
    # rebuilds this image, so re-pinning to a live digest is the durable fix.
    digest: "sha256:4a003896479ea47e3efd0f01f9aa35247d86cf4129087bd5bfb294c3d8d9c8ee"
    tag: "2026-10-05-sha.4a003896479e"

# The pod is pinned to the node whose containerd holds the imported image.
nodeName: nexus

service:
  port: 8080

# hostPath (rationale in k8s/astral-key-deployment.yaml): Longhorn's admission
# webhook is unreachable and local-path binding stalls for nodeName-pinned pods.
persistence:
  hostPath: /var/lib/astral-key

env:
  serverHost: "0.0.0.0"
  serverPort: "8080"
  databaseUrl: "sqlite:///data/astral-key.db?mode=rwc"
  fido2RpId: "maplespike.ca"
  fido2RpName: "MapleSpike"
  fido2Origins: "https://maplespike.ca,https://quill.maplespike.ca,https://api.maplespike.ca"
  astralWeb3Domain: "maplespike.ca"
  rustLog: "info,astral_key=debug"
  quillDomain: "maplespike.ca"

# Required by src/state.rs (>=32 bytes) — the service refuses to start without it.
jwtSecret:
  name: astral-key-jwt
  key: jwt-secret

resources: {}
