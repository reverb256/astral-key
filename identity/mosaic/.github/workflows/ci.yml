name: CI

on:
  push:
    branches: [mosaic]
  pull_request:
    branches: [mosaic]

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (excluding flaky server smoke tests)
        run: node --test --test-name-pattern="^(?!Server)" test/*.test.js

      - name: Run server smoke tests (allow failure)
        if: always()
        continue-on-error: true
        run: node --test --test-name-pattern="^Server" test/identity.test.js
