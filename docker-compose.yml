# Astral Key - Local Development Environment
#
# This docker-compose file starts all required services for local development:
# - PostgreSQL 15
# - Redis 7
# - Vaultwarden (for credential storage testing)
#
# Usage:
#   docker-compose up -d    # Start all services
#   docker-compose down     # Stop all services
#   docker-compose logs -f  # View logs
#
# ---------------------------------------------------------------------------
# REQUIRED for the astral-key app service:
#   JWT_SECRET (or JWT_SECRET_FILE) — at least 32 bytes.
#   Astral Key now panics at startup if this is missing (no insecure default).
#
#   Generate a dev secret:
#     export JWT_SECRET=$(openssl rand -hex 32)
#
#   Or generate a file-based secret:
#     echo "$(openssl rand -hex 32)" > ./.secrets/jwt_secret && chmod 600 ./.secrets/jwt_secret
#     export JWT_SECRET_FILE=./.secrets/jwt_secret
# ---------------------------------------------------------------------------

version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: astral-key-postgres
    environment:
      POSTGRES_DB: astral_key
      POSTGRES_USER: astral
      POSTGRES_PASSWORD: astral
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astral -d astral_key"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - astral-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: astral-key-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - astral-network

  # Vaultwarden (for credential storage testing)
  vaultwarden:
    image: vaultwarden/server:latest-alpine
    container_name: astral-key-vaultwarden
    environment:
      # Server settings
      DOMAIN: "http://localhost:8000"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: 8000

      # Admin settings
      ADMIN_TOKEN: "admin_token_for_dev_only_change_in_production"

      # Disable signups (managed by Astral Key)
      SIGNUPS_ALLOWED: false

      # Database (use SQLite for simplicity)
      DATABASE_URL: "/data/db.sqlite3"

      # Logging
      LOG_LEVEL: "debug"
      EXTENDED_LOGGING: "true"
    ports:
      - "8000:8000"
    volumes:
      - vaultwarden_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/alive"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - astral-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vaultwarden_data:
    driver: local

networks:
  astral-network:
    driver: bridge
