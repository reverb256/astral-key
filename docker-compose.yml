version: "3.9"

# =============================================================================
# Astral Key — Docker Compose (SQLite, single-service)
# =============================================================================
# No external dependencies required — the server embeds SQLite.
#
# Quick start:
#   docker compose up -d
#   curl http://localhost:8080/health
#
# For production, override JWT_SECRET with a strong random value:
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d
# =============================================================================

services:
  astral-key:
    # Official image on GitHub Container Registry.
    # Build your own with: docker build -t ghcr.io/reverb256/astral-key:latest .
    image: ghcr.io/reverb256/astral-key:latest
    container_name: astral-key
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Server
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"

      # Database — SQLite file persisted on the named volume
      DATABASE_URL: "sqlite:/data/astral-key.db?mode=rwc"

      # JWT — CHANGE THIS IN PRODUCTION
      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-random-secret}"

      # FIDO2 / WebAuthn
      FIDO2_RP_ID: "localhost"
      FIDO2_ORIGINS: "http://localhost:8080"

      # Logging
      RUST_LOG: "${RUST_LOG:-info,astral_key=debug}"

    volumes:
      # Persistent SQLite database
      - astral-key-data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  astral-key-data:
